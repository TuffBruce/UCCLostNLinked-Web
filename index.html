<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/images/LostNLinkedLogo.jpg">
    <title>Dashboard</title>
    <!-- Link HTML to CSS File -->
    <link rel="stylesheet" href="/assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Heading Bar -->
    <nav class="dashboard-headbar">
        <div id="navbar-user-info">
            <a href="settings.html" class = "nav-item">Settings</a>
            <span id="user-email"></span>
            <div class = "nav-item">
                <button id="logout-btn">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Welcome Message -->
    <div class="dashboard-container">
        <h1 class="site-title"><span class="brand-name">Out of the Blue</span></h1>
        <p class="powered-by">powered by <strong>LostNLinked</strong></p>
        <h2>Welcome, <span id="user-name"></span>, to UCC's online lost &amp; found website.</h2>
        <p class="contact-text">Contact TUBS at <i><a href="mailto:ucctubs@gmail.com" class="email-link">ucctubs@gmail.com</a></i> for more information.</p>
    </div>

    <!-- Navigation Button links -->
    <div class="dashboard-nav-buttons">
        <a href="upload-founditem.html" class="dashboard-btn">Upload Found Item</a>
        <a href="founditems.html" class="dashboard-btn">Found Items</a>
        <a href="report-lostitem.html" class="dashboard-btn">Report Lost Item</a>
        <a href="lostitems.html" class="dashboard-btn">Lost Items</a>
    </div>

    <!-- Scripts -->
    <script type="module" src="/assets/js/navbar.js"></script>
    <script type="module" src="/assets/js/dashboard.js"></script>
</body>
</html>
